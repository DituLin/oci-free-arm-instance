name: Try to Create OCI Always Free A1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: oci-a1-create
  cancel-in-progress: false

env:
  OCI_CLI_REGION: us-phoenix-1
  INSTANCE_NAME: always-free-a1
  VCN_NAME: always-free-a1-vcn
  SUBNET_NAME: always-free-a1-public-subnet
  IGW_NAME: always-free-a1-internet-gateway
  ROUTE_TABLE_NAME: always-free-a1-public-route-table
  SECURITY_LIST_NAME: always-free-a1-security-list
  OCPUS: "1"
  MEMORY_GB: "2"
  BOOT_VOLUME_GB: "50"

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install OCI CLI
        run: |
          python3 -m pip install --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=${HOME}/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF
          chmod 600 "$HOME/.oci/config"
          oci iam region list >/dev/null

      - name: Try to create an Always Free A1 instance
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          COMPARTMENT_ID="$OCI_CLI_TENANCY"

          existing_instance_id="$(oci compute instance list --compartment-id "$COMPARTMENT_ID" --display-name "$INSTANCE_NAME" --lifecycle-state RUNNING --query 'data[0].id' --raw-output 2>/dev/null || true)"
          if [ -n "$existing_instance_id" ] && [ "$existing_instance_id" != "null" ]; then
            echo "Instance already exists and is RUNNING: $existing_instance_id"
            exit 0
          fi

          vcn_id="$(oci network vcn list --compartment-id "$COMPARTMENT_ID" --display-name "$VCN_NAME" --lifecycle-state AVAILABLE --query 'data[0].id' --raw-output 2>/dev/null || true)"
          if [ -z "$vcn_id" ] || [ "$vcn_id" = "null" ]; then
            vcn_id="$(oci network vcn create --compartment-id "$COMPARTMENT_ID" --cidr-block "10.88.0.0/16" --display-name "$VCN_NAME" --dns-label "a1free" --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          fi

          igw_id="$(oci network internet-gateway list --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --display-name "$IGW_NAME" --lifecycle-state AVAILABLE --query 'data[0].id' --raw-output 2>/dev/null || true)"
          if [ -z "$igw_id" ] || [ "$igw_id" = "null" ]; then
            igw_id="$(oci network internet-gateway create --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --is-enabled true --display-name "$IGW_NAME" --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          fi

          route_table_id="$(oci network route-table list --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --display-name "$ROUTE_TABLE_NAME" --lifecycle-state AVAILABLE --query 'data[0].id' --raw-output 2>/dev/null || true)"
          if [ -z "$route_table_id" ] || [ "$route_table_id" = "null" ]; then
            route_table_id="$(oci network route-table create --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --display-name "$ROUTE_TABLE_NAME" --route-rules "[{\"cidrBlock\":\"0.0.0.0/0\",\"networkEntityId\":\"${igw_id}\"}]" --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          fi

          security_list_id="$(oci network security-list list --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --display-name "$SECURITY_LIST_NAME" --lifecycle-state AVAILABLE --query 'data[0].id' --raw-output 2>/dev/null || true)"
          if [ -z "$security_list_id" ] || [ "$security_list_id" = "null" ]; then
            security_list_id="$(oci network security-list create --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --display-name "$SECURITY_LIST_NAME" --egress-security-rules '[{"destination":"0.0.0.0/0","protocol":"all","isStateless":false}]' --ingress-security-rules '[{"source":"0.0.0.0/0","protocol":"6","isStateless":false,"tcpOptions":{"destinationPortRange":{"min":22,"max":22}}}]' --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          fi

          subnet_id="$(oci network subnet list --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --display-name "$SUBNET_NAME" --lifecycle-state AVAILABLE --query 'data[0].id' --raw-output 2>/dev/null || true)"
          if [ -z "$subnet_id" ] || [ "$subnet_id" = "null" ]; then
            subnet_id="$(oci network subnet create --compartment-id "$COMPARTMENT_ID" --vcn-id "$vcn_id" --cidr-block "10.88.1.0/24" --display-name "$SUBNET_NAME" --dns-label "a1pub" --route-table-id "$route_table_id" --security-list-ids "[\"${security_list_id}\"]" --prohibit-public-ip-on-vnic false --wait-for-state AVAILABLE --query 'data.id' --raw-output)"
          fi

          image_id="$(oci compute image list --compartment-id "$COMPARTMENT_ID" --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --sort-order DESC --all --query 'data[0].id' --raw-output)"
          if [ -z "$image_id" ] || [ "$image_id" = "null" ]; then
            echo "No Ubuntu 22.04 image found for VM.Standard.A1.Flex in ${OCI_CLI_REGION}."
            exit 1
          fi

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/ssh_public_key.pub"
          ads="$(oci iam availability-domain list --compartment-id "$COMPARTMENT_ID" --query 'data[*].name' --output json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)))')"

          created="false"
          while IFS= read -r ad_name; do
            [ -n "$ad_name" ] || continue
            echo "Trying ${INSTANCE_NAME} in availability domain: ${ad_name}"
            if oci compute instance launch --compartment-id "$COMPARTMENT_ID" --availability-domain "$ad_name" --shape "VM.Standard.A1.Flex" --shape-config "{\"ocpus\":${OCPUS},\"memoryInGBs\":${MEMORY_GB}}" --subnet-id "$subnet_id" --image-id "$image_id" --ssh-authorized-keys-file "$RUNNER_TEMP/ssh_public_key.pub" --assign-public-ip true --display-name "$INSTANCE_NAME" --boot-volume-size-in-gbs "$BOOT_VOLUME_GB" --wait-for-state RUNNING; then
              created="true"
              break
            fi
          done <<< "$ads"

          if [ "$created" != "true" ]; then
            echo "No capacity available for VM.Standard.A1.Flex right now. The scheduled workflow will retry."
            exit 1
          fi

          echo "Instance created successfully."
